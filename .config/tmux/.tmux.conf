#Prefix
# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
    
# Pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Change color scheme
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# ============================================
# Vi-style copy mode and status-line keys
# ============================================
# Use vi keys
setw -g mode-keys vi
 
# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"  # macOS
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux


# Reload this config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

###  --- VIM LIKE KEYS --- ###

# Create panes using Vim-like keys
# Prefix + | = vertical split
# Prefix + - = horizontal split
bind h split-window -h
bind v split-window -v

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Also allow Alt+h/j/k/l without pressing the prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes with Prefix + H/J/K/L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Kill Window/Pane
bind-key & kill-window
bind-key x kill-pane

# Enable mouse support
set -g mouse on

# Keep panes and windows in the current working directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Slightly cleaner status line
set -g status-interval 5
set -g status-left "[#S] "
set -g status-left-length 30
set -g status-right "%Y-%m-%d %H:%M"
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "

# Personal Colors
set -g status-bg red
set -g status-fg orange
set -g status-attr dim